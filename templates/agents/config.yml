# Settings every agent and every shiplane command reads (https://github.com/klovr-co/shiplane). Change them here, nowhere else.
# `shiplane init` adds keys that are missing and never changes the ones you set.

# Where "ship", "merge", "go" and "make it live" go: production or staging.
#   staging:    merge into the staging branch; production only when the owner says "release", "promote", "production", "prod" or "main".
#   production: straight to production.
shipTarget: {{shipTarget}}

branches:
  production: {{production}}
  staging: {{staging}}

# Changes that wait for the owner's yes: label needs-owner and a first line "Needs owner: <the decision>".
needsOwner:
  paths:{{needsOwnerPaths}}
  categories:{{needsOwnerCategories}}

# The repo's own pre-push check, run after shiplane's line-ending and generated-file checks (git's pre-push stdin is
# passed through). null: none. The adopt skill writes it from what CI runs cheaply.
checkCommand: {{checkCommand}}

# The repo's full credential-free CI suite, too slow for every push: `shiplane ship` runs it once in the repo root before it
# posts @mergifyio queue (and again before each re-queue after a push), on a clean checkout of the PR's head, with
# SHIPLANE_BASE_REF and SHIPLANE_SHIP_BRANCH set. A sha that passed is not run again. null: none. The adopt skill writes it.
queueCheckCommand: {{queueCheckCommand}}

# How a fresh worktree installs dependencies. null: shiplane detects it from the lockfile and version pins.
installCommand: {{installCommand}}

# Generators whose output is committed: the pre-push gate runs each and fails if the tree changes.
generated:{{generated}}

# Workflow files that deploy a merge into the ship branch; `shiplane ship` waits for their runs on the merge commit.
deployWorkflows:{{deployWorkflows}}

# Where to look after a deploy.
liveUrl: {{liveUrl}}

# How the merge queue merges each PR: squash, merge (its own merge commit, so bisect and revert work per PR) or rebase.
mergeMethod: {{mergeMethod}}

# The check the merge queue waits for on its batch draft: the name of the CI gate job (templates/ci/gate.snippet.yml).
ciCheck: {{ciCheck}}

# GitHub logins of the people who decide (needs-owner) and hear about a red live branch: the shiplane events workflow
# assigns them. Example: [octocat]
owners:{{owners}}

# Hand-written AGENTS.md sections (by heading) that the shiplane block replaces: `shiplane init` removes them and says so in its
# PR. [] keeps every section.
supersededSections:{{supersededSections}}

# Extra comment lines kept at the top of .github/workflows/shiplane-events.yml (a repo's CI rules may require some, such as
# "# Dry run: ..." and "# Revert: ..."). Existing "# Dry run:" and "# Revert:" lines there are kept as well.
workflowHeader:{{workflowHeader}}
